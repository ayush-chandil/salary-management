spring:
  application:
    name: salary-management-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${DB_USERNAME:salary}
    password: ${DB_PASSWORD:salary}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # Flyway owns the schema; Hibernate only checks that it matches the entities.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.acme.salary: ${LOG_LEVEL:INFO}

app:
  seed:
    employees: ${SEED_EMPLOYEES:10000}
    # Fixed, so a seeded demo is reproducible. Change it for different demo data.
    random-seed: ${SEED_RANDOM:20260101}
    reset: ${SEED_RESET:true}

---
# Activated with -Dspring-boot.run.profiles=seed. Runs the seed, then exits.
spring:
  config:
    activate:
      on-profile: seed
  main:
    web-application-type: none
