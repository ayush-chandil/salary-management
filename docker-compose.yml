services:
  postgres:
    image: postgres:16-alpine
    container_name: salary_mgmt_db
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salary -d salary_management']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
